<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eurisko — Il nuovo sito sta per arrivare</title>
<meta name="description" content="Stiamo finalizzando il nuovo euriskosrl.it. Torneremo online a brevissimo.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#040810">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #040810;
    color: #F5F1E8;
    font-family: 'Switzer', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  /* ===== STAGE ===== */
  .stage {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* ===== GLOW DI FONDO (rosso radiale dietro il video) ===== */
  .glow {
    position: absolute;
    width: clamp(560px, 90vw, 1200px);
    aspect-ratio: 1 / 1;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side,
      rgba(196, 30, 58, 0.34) 0%,
      rgba(196, 30, 58, 0.10) 35%,
      rgba(196, 30, 58, 0) 70%);
    filter: blur(8px);
    z-index: 1;
    animation: pulse 6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1.00; transform: translate(-50%, -50%) scale(1.06); }
  }
  /* ===== PARTICELLE + ARCHI (SVG) ===== */
  .field {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
  }
  .field .arc { fill: none; stroke: #C41E3A; stroke-width: 0.8; }
  /* ===== LOGO IN ALTO ===== */
  .topbar {
    position: absolute; top: clamp(20px, 3vh, 38px);
    left: 0; right: 0; text-align: center; z-index: 5;
  }
  .topbar img {
    width: clamp(110px, 14vw, 160px);
    height: auto;
    filter: drop-shadow(0 0 18px rgba(245, 241, 232, 0.45));
  }
  /* ===== CENTRO: VIDEO + TESTI ===== */
  .center {
    position: relative; z-index: 4;
    text-align: center;
    padding: 0 24px;
    width: 100%;
    max-width: 880px;
  }
  .globe-wrap {
    position: relative;
    width: clamp(220px, 34vw, 420px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }
  .globe-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 0 30px rgba(196, 30, 58, 0.55)) drop-shadow(0 18px 60px rgba(196, 30, 58, 0.35));
    animation: globePulse 5.5s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes globePulse {
    0%, 100% { transform: scale(1.00); filter: drop-shadow(0 0 24px rgba(196,30,58,0.45)) drop-shadow(0 18px 60px rgba(196,30,58,0.30)); }
    50%      { transform: scale(1.04); filter: drop-shadow(0 0 42px rgba(196,30,58,0.75)) drop-shadow(0 22px 80px rgba(196,30,58,0.45)); }
  }
  .bar {
    display: inline-block;
    width: clamp(48px, 5vw, 72px); height: 3px;
    background: #C41E3A;
    margin: clamp(28px, 4vh, 44px) 0 clamp(18px, 2.4vh, 24px);
    border-radius: 2px;
  }
  h1 {
    font-family: 'Switzer', system-ui, sans-serif;
    font-size: clamp(30px, 5.6vw, 84px);
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.02;
    margin: 0 0 clamp(14px, 2vh, 20px);
    color: #F5F1E8;
    overflow-wrap: anywhere;
    word-wrap: break-word;
  }
  h1 .accent {
    display: inline-block;
    font-family: 'Oswald', 'Switzer', sans-serif;
    font-weight: 400;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #C41E3A;
    background-image: linear-gradient(100deg, #8E1323 0%, #C41E3A 22%, #FF4D66 50%, #C41E3A 78%, #8E1323 100%);
    background-size: 300% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-top: 0.04em;
  }
  p.lede {
    font-size: clamp(14px, 1.8vw, 18px);
    line-height: 1.6;
    color: #a9b0bd;
    margin: 0 auto;
    max-width: 560px;
  }
  p.lede strong { color: #F5F1E8; font-weight: 600; }
  p.lede br + span,
  p.lede .l2 { display: block; }
  /* ===== CONTATTI ===== */
  .contacts {
    position: absolute; left: 0; right: 0; bottom: clamp(22px, 3.5vh, 42px);
    text-align: center; z-index: 5;
    font-size: clamp(12px, 1.4vw, 14px); color: #a9b0bd; line-height: 1.7;
    padding: 0 24px;
  }
  .contacts a {
    color: #F5F1E8; text-decoration: none;
    border-bottom: 1px solid rgba(245, 241, 232, 0.30); padding-bottom: 1px;
    transition: color .2s, border-color .2s;
  }
  .contacts a:hover, .contacts a:focus {
    color: #C41E3A; border-bottom-color: #C41E3A;
  }
  .contacts .row2 {
    margin-top: 10px;
    font-size: clamp(10px, 1.1vw, 11px);
    color: #6b7280; letter-spacing: 0.18em; text-transform: uppercase;
  }
  /* ===== ANIMAZIONE PARTICELLE ===== */
  .field circle { animation: float var(--d, 12s) ease-in-out var(--dl, 0s) infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0); opacity: var(--o, 0.6); }
    50%      { transform: translate(var(--tx, 8px), var(--ty, -10px)); opacity: calc(var(--o, 0.6) * 0.4); }
  }
  /* ===== MOBILE TWEAK ===== */
  @media (max-width: 720px) {
    .contacts .row1 br { display: inline; }
    .topbar img { filter: drop-shadow(0 0 14px rgba(245, 241, 232, 0.55)); }
    h1 { letter-spacing: 0.01em; }
  }
  /* ===== ACCESSIBILITÀ ===== */
  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; }
    .field circle { animation: none !important; }
    .globe-wrap img { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- glow rosso radiale -->
  <div class="glow" aria-hidden="true"></div>

  <!-- particelle + archi orbitali (generati via JS) -->
  <svg class="field" id="field" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

  <!-- logo top -->
  <div class="topbar">
    <img src="logo-eurisko-WR.png" alt="Eurisko S.r.l." width="160" height="46">
  </div>

  <!-- video centrale + testi -->
  <main class="center">
    <div class="globe-wrap">
      <img src="logo-eurisko-mondo.png" alt="" aria-hidden="true" width="420" height="420">
    </div>
    <span class="bar" aria-hidden="true"></span>
    <h1>Il nuovo sito sta per<br><span class="accent">arrivare.</span></h1>
    <p class="lede">
      Stiamo finalizzando il nuovo sito <strong>euriskosrl.it</strong>.<br>
      <span class="l2">Torneremo online a brevissimo.</span>
    </p>
  </main>

  <!-- contatti -->
  <div class="contacts">
    <div class="row1">
      Per qualunque necessità scrivici a
      <a href="mailto:info@euriskosrl.it">info@euriskosrl.it</a>
      <br>
      o chiamaci al <a href="tel:+393481565772">+39 348 156 5772</a>.
    </div>
    <div class="row2">Eurisko S.r.l. &middot; Servizi di Consulenza SAP</div>
  </div>
</div>

<script>
  // Genera particelle + archi orbitali via JS (densità adattata al viewport)
  (function () {
    var field = document.getElementById('field');
    if (!field) return;
    var W = 1600, H = 900, cx = 800, cy = 450;
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var isMobile = window.matchMedia('(max-width: 720px)').matches;

    // 3 archi orbitali
    var arcs = [[300, 0.32], [360, 0.18], [240, 0.24]];
    arcs.forEach(function (a) {
      var el = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      el.setAttribute('cx', cx); el.setAttribute('cy', cy);
      el.setAttribute('rx', a[0]); el.setAttribute('ry', a[0] * 0.85);
      el.setAttribute('class', 'arc');
      el.setAttribute('stroke-opacity', a[1]);
      field.appendChild(el);
    });

    function rnd(min, max) { return min + Math.random() * (max - min); }
    function rndInt(min, max) { return Math.floor(rnd(min, max + 1)); }

    // Nuvola anulare densa attorno al video + sciame ampio
    var ringN = isMobile ? 120 : 260;
    var cloudN = isMobile ? 180 : 380;
    function makeDot(x, y, r, color, opacity) {
      var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', x.toFixed(1));
      c.setAttribute('cy', y.toFixed(1));
      c.setAttribute('r', r.toFixed(2));
      c.setAttribute('fill', color);
      c.setAttribute('opacity', opacity);
      if (!reduced) {
        var tx = rnd(-14, 14), ty = rnd(-14, 14);
        c.style.setProperty('--tx', tx.toFixed(1) + 'px');
        c.style.setProperty('--ty', ty.toFixed(1) + 'px');
        c.style.setProperty('--d', rnd(6, 14).toFixed(1) + 's');
        c.style.setProperty('--dl', (-rnd(0, 14)).toFixed(1) + 's');
        c.style.setProperty('--o', opacity);
      }
      field.appendChild(c);
    }
    // Anello stretto (denso)
    for (var i = 0; i < ringN; i++) {
      var ang = Math.random() * Math.PI * 2;
      var r = rnd(240, 320);
      var x = cx + r * Math.cos(ang);
      var y = cy + r * Math.sin(ang) * 0.88;
      var size = [0.8, 1.0, 1.2, 1.4, 1.8, 2.4, 3.0][rndInt(0, 6)];
      var roll = Math.random();
      var col = roll < 0.10 ? '#C41E3A' : (roll < 0.65 ? '#F5F1E8' : '#7d8a9b');
      makeDot(x, y, size, col, rnd(0.25, 0.95).toFixed(2));
    }
    // Nuvola esterna (rada)
    for (var j = 0; j < cloudN; j++) {
      var ang2 = Math.random() * Math.PI * 2;
      var r2 = rnd(340, 800);
      var x2 = cx + r2 * Math.cos(ang2);
      var y2 = cy + r2 * Math.sin(ang2) * 0.6 + rnd(-40, 40);
      var size2 = [0.6, 0.9, 1.2, 1.5][rndInt(0, 3)];
      var col2 = Math.random() < 0.7 ? '#F5F1E8' : '#7d8a9b';
      makeDot(x2, y2, size2, col2, rnd(0.10, 0.55).toFixed(2));
    }
  })();
</script>
</body>
</html>
