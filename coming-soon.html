<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eurisko — Il nuovo sito sta per arrivare</title>
<meta name="description" content="Stiamo finalizzando il nuovo euriskosrl.it. Torneremo online a brevissimo.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#040810">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #040810;
    color: #F5F1E8;
    font-family: 'Switzer', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  /* ===== STAGE ===== */
  .stage {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* ===== PARTICELLE + ARCHI (SVG) ===== */
  .field {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
  }
  .field .arc { fill: none; stroke: #C41E3A; stroke-width: 0.8; }
  /* ===== LOGO IN ALTO ===== */
  .topbar {
    position: absolute; top: clamp(20px, 3vh, 38px);
    left: 0; right: 0; text-align: center; z-index: 5;
  }
  .topbar img {
    width: clamp(110px, 14vw, 160px);
    height: auto;
    filter: drop-shadow(0 0 18px rgba(245, 241, 232, 0.45));
  }
  /* ===== CENTRO: globo + testi (flex naturale, tutto si dispone) ===== */
  .center {
    position: relative; z-index: 4;
    text-align: center;
    padding: 0 24px;
    width: 100%;
    max-width: 880px;
  }
  .globe-wrap {
    position: relative;
    width: clamp(240px, 38vw, 540px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }
  .globe-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    animation: globePulse 5.5s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes globePulse {
    0%, 100% { transform: scale(1.00); }
    50%      { transform: scale(1.04); }
  }
  .bar {
    display: inline-block;
    width: clamp(48px, 5vw, 72px); height: 3px;
    background: #C41E3A;
    margin: clamp(28px, 4vh, 44px) 0 clamp(18px, 2.4vh, 24px);
    border-radius: 2px;
  }
  h1 {
    font-family: 'Switzer', system-ui, sans-serif;
    font-size: clamp(26px, 3.6vw, 56px);
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.02;
    margin: clamp(18px, 3vh, 30px) 0 0;
    color: #F5F1E8;
    overflow-wrap: anywhere;
    word-wrap: break-word;
  }
  h1 .accent {
    display: inline-block;
    font-family: 'Oswald', 'Switzer', sans-serif;
    font-weight: 400;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #C41E3A;
    background-image: linear-gradient(100deg, #8E1323 0%, #C41E3A 22%, #FF4D66 50%, #C41E3A 78%, #8E1323 100%);
    background-size: 300% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: emShimmer 9s ease-in-out infinite;
    margin-top: 0.04em;
  }
  @keyframes emShimmer {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  p.launch-date {
    position: relative;
    margin: clamp(2px, 0.6vh, 10px) 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 1.8vw, 26px);
    font-family: 'Oswald', 'Switzer', sans-serif;
    font-weight: 400;
    font-size: clamp(30px, 5.6vw, 64px);
    letter-spacing: 0.1em;
    color: #F5F1E8;
    font-variant-numeric: tabular-nums;
  }
  p.launch-date::before {
    content: "";
    position: absolute;
    inset: -60px -16%;
    background: radial-gradient(ellipse at center,
      rgba(196, 30, 58, 0.95) 0%,
      rgba(196, 30, 58, 0.55) 28%,
      rgba(196, 30, 58, 0.18) 55%,
      rgba(196, 30, 58, 0) 75%);
    filter: blur(36px);
    pointer-events: none;
    animation: dateGlow 4s ease-in-out infinite;
  }
  @keyframes dateGlow {
    0%, 100% { opacity: 0.90; transform: scale(0.94); }
    50%      { opacity: 1.00; transform: scale(1.10); }
  }
  p.launch-date .d-mark {
    color: #F5F1E8;
    font-weight: 400;
    font-size: 0.9em;
    position: relative;
  }
  p.launch-date time {
    position: relative;
  }
  /* ===== CONTATTI ===== */
  .contacts {
    position: absolute; left: 0; right: 0; bottom: clamp(22px, 3.5vh, 42px);
    text-align: center; z-index: 5;
    font-size: clamp(12px, 1.4vw, 14px); color: #a9b0bd; line-height: 1.7;
    padding: 0 24px;
  }
  .contacts a {
    color: #F5F1E8; text-decoration: none;
    border-bottom: 1px solid rgba(245, 241, 232, 0.30); padding-bottom: 1px;
    transition: color .2s, border-color .2s;
  }
  .contacts a:hover, .contacts a:focus {
    color: #C41E3A; border-bottom-color: #C41E3A;
  }
  .contacts .row2 {
    margin-top: 10px;
    font-size: clamp(10px, 1.1vw, 11px);
    color: #6b7280; letter-spacing: 0.18em; text-transform: uppercase;
  }
  /* ===== ANIMAZIONE PARTICELLE ===== */
  .field circle { animation: float var(--d, 12s) ease-in-out var(--dl, 0s) infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0); opacity: var(--o, 0.6); }
    50%      { transform: translate(var(--tx, 8px), var(--ty, -10px)); opacity: calc(var(--o, 0.6) * 0.4); }
  }
  /* ===== MOBILE TWEAK ===== */
  @media (max-width: 720px) {
    .contacts .row1 br { display: inline; }
    .topbar img { filter: drop-shadow(0 0 14px rgba(245, 241, 232, 0.55)); }
    h1 { letter-spacing: 0.01em; }
    .globe-wrap { width: clamp(260px, 70vw, 420px); }
  }
  /* ===== ACCESSIBILITÀ ===== */
  @media (prefers-reduced-motion: reduce) {
    .field circle { animation: none !important; }
    .globe-wrap img { animation: none !important; }
    h1 .accent { animation: none !important; }
    p.launch-date::before { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- particelle + archi orbitali (generati via JS) -->
  <svg class="field" id="field" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

  <!-- logo top -->
  <div class="topbar">
    <img src="logo-eurisko-WR.png" alt="Eurisko S.r.l." width="160" height="46">
  </div>

  <!-- globo + testi (blocco centrato verticalmente) -->
  <main class="center">
    <div class="globe-wrap">
      <img src="logo-eurisko-mondo.png" alt="" aria-hidden="true" width="420" height="420">
    </div>
    <p class="launch-date" aria-label="Data di lancio: 1 giugno 2026">
      <span class="d-mark" aria-hidden="true">—</span>
      <time datetime="2026-06-01">01.06.2026</time>
      <span class="d-mark" aria-hidden="true">—</span>
    </p>
    <h1>Nuovo sito. <span class="accent">stesso dna.</span></h1>
  </main>

  <!-- footer -->
  <div class="contacts">
    <div class="row2">Eurisko S.r.l. &middot; Servizi di Consulenza SAP &middot; info@euriskosrl.it</div>
  </div>
</div>

<script src="coming-soon.js" defer></script>
</body>
</html>
